[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uhtline"
version = "1.0.0"
description = "Deterministic offline runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
uhtline = "uhtline.cli:run"

[tool.setuptools.packages.find]
include = ["uhtline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
